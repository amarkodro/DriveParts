<section class="products">
  <!-- Featured Parts -->
  <div class="container">
    <h2>Parts Featured</h2>
    <div class="product-grid">
      <div *ngFor="let part of featuredParts" class="product-card">
        <img [src]="'http://localhost:7000' + part.partImage || 'https://via.placeholder.com/300x200'" alt="{{ part.name }}" class="product-image" />
        <h3>{{ part.name }}</h3>
        <p>{{ part.price }} KM</p>
        <p>{{ part.description }}</p>
        <button class="btn">Add to Cart</button>
      </div>
    </div>
  </div>

  <!-- New Arrivals -->
  <div class="container">
    <h2>New Arrivals</h2>
    <div class="product-grid">
      <div *ngFor="let part of newArrivalParts" class="product-card">
        <img [src]="'http://localhost:7000' + part.partImage || 'https://via.placeholder.com/300x200'" alt="{{ part.name }}" class="product-image" />
        <h3>{{ part.name }}</h3>
        <p>{{ part.price }} KM</p>
        <p>{{ part.description }}</p>
        <button class="btn">Add to Cart</button>
      </div>
    </div>
  </div>

  <!-- On Sale -->
  <div class="container">
    <h2>On Sale</h2>
    <div class="product-grid">
      <div *ngFor="let part of onSaleParts" class="product-card">
        <img [src]="'http://localhost:7000' + part.partImage || 'https://via.placeholder.com/300x200'" alt="{{ part.name }}" class="product-image" />
        <h3>{{ part.name }}</h3>
        <p>{{ part.price }} KM</p>
        <p>{{ part.description }}</p>
        <button class="btn">Add to Cart</button>
      </div>
    </div>
  </div>
</section>
