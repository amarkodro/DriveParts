<div class="chat-container">
  <!-- Chat Header -->
  <div class="chat-header">
    <div class="chat-title">AI Assistant</div>
    <div class="status-indicator">
      <div class="status-dot" [ngClass]="{
        'online': aiStatus.includes('Using'),
        'offline': aiStatus === 'Service offline'
      }"></div>
      <span>{{aiStatus}}</span>
    </div>
  </div>
  
  <!-- Messages Container -->
  <div #messagesContainer class="messages-container">
    <!-- Message History -->
    <div *ngFor="let message of messages" class="message" 
         [ngClass]="{
           'user-message': message.role === 'user',
           'ai-message': message.role === 'assistant'
         }">
      <div *ngIf="message.role === 'assistant'" class="ai-header">
        <div class="ai-icon">AI</div>
        <span>Assistant</span>
      </div>
      <p>{{message.content}}</p>
    </div>
    
    <!-- Typing indicator -->
    <div *ngIf="isTyping" class="typing-indicator">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
    
    <!-- Speech recognition status -->
    <div *ngIf="isListening" class="speech-status">
      <div class="pulse-dot"></div>
      <span>Listening... Speak now</span>
    </div>
  </div>
  
  <!-- Input Area -->
  <div class="input-area">
    <input 
      type="text" 
      class="message-input" 
      [(ngModel)]="newQuestion" 
      (keydown.enter)="ask()"
      placeholder="Type your message..."
      autocomplete="off"
    >
    <div class="input-buttons">
      <button 
  class="voice-button" 
  (click)="toggleVoiceRecognition()"
  [class.listening]="isListening"
  [disabled]="isTyping" 
  title="Voice Input"
>
  <i class="fas" [ngClass]="isListening ? 'fa-microphone-slash' : 'fa-microphone'"></i>
</button>
      <button 
        class="send-button" 
        (click)="ask()" 
        [disabled]="!newQuestion.trim() || isTyping"
      >
        Send
      </button>
    </div>
  </div>
</div>
