<section class="login">
  <div class="container">
    <div class="header">
      <img src="assets/user.png" alt="Log In Icon" class="login-icon">
      <h2>Log In</h2>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" formControlName="username">
        <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
          <small class="error-text">Username is required.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" formControlName="password">
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          <small class="error-text">Password is required.</small>
        </div>
      </div>

      <button type="submit" class="btn primary-btn" [disabled]="loginForm.invalid">Log In</button>
    </form>

    <div class="divider">
      <span>Or log in with</span>
    </div>

    <div class="social-buttons">
      <button type="button" class="btn-social google-btn">
        <img src="assets/icons8-google-50.png" alt="Google"> Log in with Google
      </button>
    </div>

    <p class="register-link">Don't have an account? <a routerLink="/register">Register</a></p>
  </div>
</section>
