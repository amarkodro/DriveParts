<div class="container mt-5 p-3 rounded cart">
  <div class="row no-gutters">
    <div class="col-md-8">
      <div class="product-details mr-2">
        <div class="d-flex flex-row align-items-center">
          <i class="fa fa-long-arrow-left"></i>
          <span class="ml-2">Continue Shopping</span>
        </div>
        <hr>
        <h6 class="mb-0">Shopping cart</h6>
        <div class="d-flex justify-content-between">
          <span>You have {{ cartItems.length }} items in your cart</span>
        </div>

        <div *ngFor="let item of cartItems" class="cart-row d-flex align-items-center mb-3">
          <div class="item-img me-3">
            <img [src]="item.image" alt="Image" class="rounded" width="60" height="60">
          </div>

          <div class="item-name me-3 flex-grow-1">
            <strong>{{ item.name }}</strong>
          </div>

          <div class="item-qty me-3">
            <input type="number" class="form-control text-center" [(ngModel)]="item.quantity" min="1" max="10" style="width: 70px;" (change)="onQuantityChanged(item)" />
          </div>

          <div class="item-price me-3">
            <strong>{{ item.price }} KM</strong>
          </div>

          <div class="item-remove">
            <i class="fa fa-trash text-danger" style="cursor: pointer;" (click)="removeItem(item.partId)"></i>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="payment-info">
        <form [formGroup]="checkoutForm" (ngSubmit)="submitOrder()">

          <!-- Kupon input sa lebdećom labelom -->
          <div class="form-group floating-label">
            <input
              type="text"
              class="form-control"
              id="couponCode"
              formControlName="couponCode"
              placeholder=" " />
            <label for="couponCode">Enter coupon code</label>

            <button
              type="button"
              class="btn btn-sm btn-secondary mt-2"
              (click)="applyCoupon()">
              Apply
            </button>

            <div *ngIf="discount > 0" class="mt-2 text-success">
              Discount applied: -{{ discount }} KM
            </div>
          </div>

          <hr class="line">

          <!-- Subtotal, shipping, total -->
          <div class="d-flex justify-content-between information">
            <span>Subtotal</span><span>{{ totalPrice }} KM</span>
          </div>
          <div class="d-flex justify-content-between information">
            <span>Total (Incl. taxes)</span><span>{{ finalTotal }} KM</span>
          </div>

          <!-- Submit dugme -->
          <button
            class="btn btn-primary btn-block d-flex justify-content-between mt-3"
            type="submit"
            [disabled]="checkoutForm.invalid || cartItems.length === 0">
            <span>Checkout<i class="fa fa-long-arrow-right ml-1"></i></span>
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
