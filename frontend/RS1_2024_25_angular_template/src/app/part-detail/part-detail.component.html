<div *ngIf="!part">Loading...</div>
<section class="py-5" *ngIf="part as p">
  <div class="container px-4 px-lg-5 my-5">
    <div class="row gx-4 gx-lg-5 align-items-center">
      <div class="col-md-5">
        <img class="card-img-top mb-5 mb-md-0 part-image" [src]="apiUrl + p.partImage" alt="{{ p.name }}" />
      </div>
      <div class="col-md-1 d-flex justify-content-center">

      </div>
      <div class="col-md-6">
        <h2>{{ p.name }}</h2>
        <p>{{ p.description }}</p>
        <div class="meta-info">
          <span class="category-part">Category: {{p.categoryName}}</span>
          <span class="manufacturer-part">Manufacturer: {{p.manufacturerName}}</span>
        </div>
        <p class="current-price">Price: {{ p.price }}KM</p>

        <div class="quantity-wrapper mb-3">
          <label class="quantity-label">Quantity</label>
          <div class="quantity-control">
            <button type="button" class="qty-btn" (click)="decreaseQuantity()">−</button>
            <input type="number" class="qty-input" [value]="quantity" value="1" min="1" readonly>
            <button type="button" class="qty-btn" (click)="increaseQuantity()">+</button>
          </div>
        </div>

        <div class="actions mb-4">
          <button class="btn btn-outline-dark me-3 add-to-cart"
            (click)="addToCart($event); $event.stopPropagation();">Add to Cart</button>
          <button class="btn btn-outline-primary add-to-favorites">Add to Favorites</button>
        </div>
        <div class="reviews">
          <h3>Customer Reviews</h3>
          <div class="stars mb-2">
            <span style="color: gold;">★ ★ ★ ★ ★</span>
          </div>
          <p>Everyone loves this part! It's simply the best choice you can make.</p>
        </div>
      </div>
    </div>
  </div>
</section>
