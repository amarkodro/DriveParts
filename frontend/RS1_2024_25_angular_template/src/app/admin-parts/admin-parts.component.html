<div class="dashboard-container">
    <div class="dashboard-sidebar">
      <h2>Manage</h2>
      <ul>
        <li><a routerLink="/dashboard" routerLinkActive="active">Dashboard</a></li>
        <li><a routerLink="/edit" routerLinkActive="active">Parts</a></li>
        <li><a routerLink="/orders" routerLinkActive="active">Orders</a></li>
        <li><a routerLink="/customers" routerLinkActive="active">Customers</a></li>
      </ul>
    </div>
    <div class="p-4">
        <h2 class="text-2xl mb-4">Parts Management</h2>
       <div class="mb-4">
          <input
            type="text"
            [(ngModel)]="searchTerm"
            (input)="onSearchChange()"
            placeholder="Search by part name..."
            class="search-input"
          >
        </div>
 <button class="add-part-btn" (click)="openAddModal()">Add Part</button>      
         <table class="min-w-full">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Price</th>
              <th>Description</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let part of paginatedParts">
              <td>{{ part.partId }}</td>
              <td>{{ part.name }}</td>
              <td>{{ part.price }}</td>
              <td>{{ part.description }}</td>
              <td class="actions-container">
                <!-- Action buttons with correct classes -->
                <button (click)="editPart(part)" class="edit-btn">Edit</button>
                <button (click)="deletePart(part.partId)" class="delete-btn">Delete</button>
              </td>
            </tr>
          </tbody>
        </table>
        <!-- Pagination Controls -->
<div class="pagination-controls">
          <button 
            *ngFor="let page of totalPages" 
            (click)="setPage(page)" 
            [class.bg-blue-600]="currentPage === page"
            class="page-button">
            {{ page }}
          </button>
        </div>
</div>
      </div>
