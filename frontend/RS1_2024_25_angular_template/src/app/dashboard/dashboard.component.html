<div class="dashboard-container">
  <div class="dashboard-sidebar">
    <h2>Manage</h2>
    <ul>
      <li><a routerLink="/dashboard" routerLinkActive="active">Dashboard</a></li>
      <li><a routerLink="/edit" routerLinkActive="active">Parts</a></li>
      <li><a routerLink="/orders" routerLinkActive="active">Orders</a></li>
      <li><a routerLink="/customers" routerLinkActive="active">Customers</a></li>
    </ul>
  </div>

  <div class="dashboard-content">
    <h2>Dashboard Overview</h2>
    
    <div class="stats-grid">
      <div class="card">
        <h3>Total Sales</h3>
        <p>{{ stats.totalSales }} $</p>
      </div>
      <div class="card">
        <h3>Total Revenue</h3>
        <p>${{ stats.totalRevenue }}</p>
      </div>
      <div class="card">
        <h3>Total Orders</h3>
        <p>{{ stats.totalOrders }}</p>
      </div>
      <div class="card">
        <h3>Total Customers</h3>
        <p>{{ stats.totalCustomers }}</p>
      </div>
    </div>
    
    <h3>Order Status Breakdown</h3>
    <div class="chart-wrapper">
      <div class="chart-container">
        <canvas id="orderChart"></canvas>
      </div>

      <!-- Legend with labels and colors on the side -->
      <div class="chart-legend">
        <div *ngFor="let label of chartLabels; let i = index" class="legend-item">
          <span class="legend-color" [style.backgroundColor]="chartColors[i]"></span>
          <span class="legend-text">{{ label }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
