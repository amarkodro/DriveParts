<section class="register">
  <div class="container">
    <div class="header">
      <img src="assets/user.png" alt="Register Icon" class="register-icon">
      <h2>Register</h2>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
      <div class="form-group">
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" formControlName="firstName">
        <div *ngIf="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched">
          <small class="error-text">First Name is required.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" formControlName="lastName">
        <div *ngIf="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched">
          <small class="error-text">Last Name is required.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" formControlName="username">
        <div *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">
          <small class="error-text">Username is required.</small>
        </div>
      </div>


      <div class="form-group email-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" formControlName="email">
        <div *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          <small class="error-text" *ngIf="registerForm.get('email')?.errors?.['required']">Email is required.</small>
          <small class="error-text" *ngIf="registerForm.get('email')?.errors?.['email']">Please enter a valid email address.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="address">Address:</label>
        <input type="text" id="address" formControlName="address">
        <div *ngIf="registerForm.get('address')?.invalid && registerForm.get('address')?.touched">
          <small class="error-text">Address is required.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" formControlName="phone">
        <div *ngIf="registerForm.get('phone')?.invalid && registerForm.get('phone')?.touched">
          <small class="error-text">Phone is required.</small>
        </div>
      </div>
      <div class="form-group">
        <label for="gender">Gender:</label>
        <select id="gender" formControlName="gender">
          <option value="">Select a gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
        <div *ngIf="registerForm.get('gender')?.invalid && registerForm.get('gender')?.touched">
          <small class="error-text">Gender is required.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" formControlName="password">
        <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          <small class="error-text">Password is required.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password:</label>
        <input type="password" id="confirmPassword" formControlName="confirmPassword">
        <div *ngIf="registerForm.get('confirmPassword')?.invalid && registerForm.get('confirmPassword')?.touched">
          <small class="error-text">Confirm Password is required.</small>
        </div>
      </div>

      <button type="submit" class="btn" [disabled]="registerForm.invalid">Register</button>
    </form>

    <div class="divider">
      <span>Or sign in with</span>
    </div>

    <div class="social-buttons">
      <button type="button" class="btn-social google-btn">
        <img src="assets/icons8-google-50.png" alt="Google"> Sign In with Google
      </button>
    </div>

    <p>Already have an account? <a routerLink="/login">Log in</a></p>
  </div>
</section>
