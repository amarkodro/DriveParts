<section class="hero" [ngClass]="{ 'fade-in': fadeState }">
  <img [src]="currentImage" class="hero-image" *ngIf="currentImage" [alt]="'Hero image ' + currentIndex" />
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <h1>Find the Auto Parts You Need</h1>
    <p>Top-quality parts for your vehicle just a click away.</p>
    <a routerLink="/parts" class="btn">Browse Products</a>
  </div>
  <button class="prev-btn" (click)="prevImage()">&#10094;</button>
  <button class="next-btn" (click)="nextImage()">&#10095;</button>
</section>
<app-product-section></app-product-section>
